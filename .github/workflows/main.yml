name: CI

on:
  push:
  pull_request:

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
      security-events: write

    defaults:
      run:
        working-directory: Globomantics.Web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"

      - name: Get version from csproj
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep -oP '(?<=<Version>).*?(?=</Version>)' Globomantics.Web.csproj || echo "0.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version found: $VERSION"

      - name: Publish
        run: |
          dotnet publish Globomantics.Web.csproj \
            --configuration Release \
            --no-build \
            --output ./publish

      - name: Zip published output
        working-directory: Globomantics.Web
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          ZIP_NAME="Globomantics.Web.${VERSION}.zip"
          # Remove any previous zip, then zip only the contents of publish/
          rm -f "${ZIP_NAME}"
          (cd publish && zip -r "../${ZIP_NAME}" . -x "*.zip")
          echo "=== Zip contents ==="
          unzip -l "${ZIP_NAME}" | head -30
          
      - name: Login to Octopus Deploy 
        uses: OctopusDeploy/login@v2
        with: 
          server: https://globomantics.octopus.app
          service_account_id: 0b1da289-e6c4-43ae-939f-92c515d5e631

      - name: Push Package to Octopus Deploy
        uses: OctopusDeploy/push-package-action@v4
        with:
          space: Default
          packages: |
            Globomantics.Web/Globomantics.Web.${{ steps.get_version.outputs.version }}.zip
